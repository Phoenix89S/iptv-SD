name: Teddi IPTV Parser

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

  push:
    paths:
      - ".github/workflows/teddi.yml"
      - "Teddi_Iptv.py"

permissions:
  contents: write

concurrency:
  group: teddi-iptv
  cancel-in-progress: false

jobs:
  teddi:
    name: Run Teddi IPTV Parser
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install FFmpeg
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      # ============================================================
      # PYTHON DEPENDENCIES
      # ============================================================
      - name: Install Python dependencies
        run: |
          set -eux

          python -m pip install --upgrade pip
          python -m pip install --upgrade aiohttp rich

      # ============================================================
      # DOWNLOAD TEDDI
      # ============================================================
      - name: Download Teddi_Iptv.py
        run: |
          set -eux

          curl --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 120 \
            "https://raw.githubusercontent.com/Phoenix89S/iptv-SD/master/Teddi_Iptv.py" \
            -o Teddi_Iptv.py

          test -s Teddi_Iptv.py

          echo "Downloaded Teddi_Iptv.py:"
          wc -l Teddi_Iptv.py
          ls -lh Teddi_Iptv.py

      # ============================================================
      # PYTHON CHECK
      # ============================================================
      - name: Check Python
        run: |
          set -eux

          python --version
          python -m pip --version

          python -c "import aiohttp; print('aiohttp:', aiohttp.__version__)"
          python -c "import rich; print('rich imported successfully')"

      # ============================================================
      # SYNTAX CHECK
      # ============================================================
      - name: Check Teddi syntax
        run: |
          set -eux

          python -m py_compile Teddi_Iptv.py

          echo "Teddi_Iptv.py syntax OK"

      # ============================================================
      # OPTIONAL HELP CHECK
      # ============================================================
      - name: Check Teddi help
        run: |
          set +e

          python Teddi_Iptv.py --help

          CODE=$?

          echo "Help exit code: $CODE"

          # Некоторые версии Teddi могут не иметь --help.
          # Поэтому этот шаг никогда не ломает workflow.
          exit 0

      # ============================================================
      # PREPARE OUTPUT
      # ============================================================
      - name: Prepare output directory
        run: |
          set -eux

          mkdir -p mega_iptv_output

          rm -f mega_iptv_output/mega_best.m3u
          rm -f mega_iptv_output/mega_all_streams.m3u
          rm -f mega_iptv_output/mega_12plus.m3u
          rm -f mega_iptv_output/mega_russia.m3u
          rm -f mega_iptv_output/mega_russia_12plus.m3u
          rm -f mega_iptv_output/Stable_Ru_IPTV.m3u
          rm -f mega_iptv_output/statistics.json
          rm -f mega_iptv_output/statistics.txt
          rm -f mega_iptv_output/stable_state.json

      # ============================================================
      # RUN TEDDI
      # ============================================================
      - name: Run Teddi IPTV Parser
        run: |
          set -eux

          echo "Starting Teddi IPTV Parser..."

          python -u Teddi_Iptv.py

          echo "Teddi IPTV Parser finished."

      # ============================================================
      # SHOW GENERATED FILES
      # ============================================================
      - name: Show generated files
        if: always()
        run: |
          echo "============================================================"
          echo "TEDDI IPTV OUTPUT"
          echo "============================================================"

          if [ -d "mega_iptv_output" ]; then
            find mega_iptv_output -maxdepth 2 -type f \
              -printf '%p (%s bytes)\n' | sort
          else
            echo "mega_iptv_output directory not found"
          fi

      # ============================================================
      # PLAYLIST STATISTICS
      # ============================================================
      - name: Show playlist statistics
        if: always()
        run: |
          echo "============================================================"
          echo "PLAYLIST STATISTICS"
          echo "============================================================"

          for file in \
            mega_iptv_output/mega_best.m3u \
            mega_iptv_output/mega_all_streams.m3u \
            mega_iptv_output/mega_12plus.m3u \
            mega_iptv_output/mega_russia.m3u \
            mega_iptv_output/mega_russia_12plus.m3u \
            mega_iptv_output/Stable_Ru_IPTV.m3u
          do
            echo
            echo "FILE: $file"

            if [ -f "$file" ]; then
              ls -lh "$file"

              echo "EXTINF:"
              grep -c '^#EXTINF:' "$file" || true

              echo "URL:"
              grep -Evc '^(#|$)' "$file" || true
            else
              echo "NOT FOUND"
            fi
          done

      # ============================================================
      # SHOW JSON STATISTICS
      # ============================================================
      - name: Show statistics.json
        if: always()
        run: |
          echo "============================================================"
          echo "statistics.json"
          echo "============================================================"

          if [ -f "mega_iptv_output/statistics.json" ]; then
            cat mega_iptv_output/statistics.json
          else
            echo "statistics.json not found"
          fi

      # ============================================================
      # SHOW TXT STATISTICS
      # ============================================================
      - name: Show statistics.txt
        if: always()
        run: |
          echo "============================================================"
          echo "statistics.txt"
          echo "============================================================"

          if [ -f "mega_iptv_output/statistics.txt" ]; then
            cat mega_iptv_output/statistics.txt
          else
            echo "statistics.txt not found"
          fi

      # ============================================================
      # SHOW STABLE STATE
      # ============================================================
      - name: Show Stable state
        if: always()
        run: |
          echo "============================================================"
          echo "STABLE STATE"
          echo "============================================================"

          if [ -f "mega_iptv_output/stable_state.json" ]; then
            cat mega_iptv_output/stable_state.json
          else
            echo "stable_state.json not found"
          fi

      # ============================================================
      # SHOW STABLE PLAYLIST
      # ============================================================
      - name: Show Stable playlist
        if: always()
        run: |
          echo "============================================================"
          echo "STABLE PLAYLIST"
          echo "============================================================"

          if [ -f "mega_iptv_output/Stable_Ru_IPTV.m3u" ]; then

            echo "File:"
            ls -lh mega_iptv_output/Stable_Ru_IPTV.m3u

            echo
            echo "Entries:"

            grep -c '^#EXTINF:' \
              mega_iptv_output/Stable_Ru_IPTV.m3u || true

          else
            echo "Stable_Ru_IPTV.m3u not found"
          fi

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Teddi results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teddi-iptv-results-${{ github.run_number }}
          path: |
            mega_iptv_output/
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # COMMIT GENERATED RESULTS
      # ============================================================
      - name: Commit generated results
        if: success()
        run: |
          set -eux

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mega_iptv_output/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Teddi IPTV: update results"
            git push
          fi