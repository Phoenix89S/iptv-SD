name: Teddi IPTV Parser

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

  push:
    paths:
      - ".github/workflows/teddi.yml"
      - "Teddi_Iptv.py"

permissions:
  contents: write

concurrency:
  group: teddi-iptv
  cancel-in-progress: false

jobs:
  teddi:
    name: Run Teddi IPTV Parser
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # ============================================================
      # SYSTEM TOOLS
      # ============================================================
      - name: Install system dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

          echo "Python:"
          python --version

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "FFprobe:"
          ffprobe -version | head -n 1

      # ============================================================
      # PYTHON DEPENDENCIES
      # ============================================================
      - name: Install Python dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir aiohttp rich

          python -c "import aiohttp; print('aiohttp OK:', aiohttp.__version__)"
          python -c "import rich; print('rich OK')"

      # ============================================================
      # DOWNLOAD TEDDI
      # ============================================================
      - name: Download Teddi_Iptv.py
        run: |
          set -euo pipefail

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 120 \
            "https://raw.githubusercontent.com/Phoenix89S/iptv-SD/master/Teddi_Iptv.py" \
            -o Teddi_Iptv.py

          test -s Teddi_Iptv.py

          echo "Teddi_Iptv.py:"
          ls -lh Teddi_Iptv.py
          wc -l Teddi_Iptv.py

      # ============================================================
      # SYNTAX CHECK
      # ============================================================
      - name: Check Teddi syntax
        run: |
          set -euo pipefail

          python -m py_compile Teddi_Iptv.py

          echo "Teddi syntax: OK"

      # ============================================================
      # IMPORT CHECK
      # ============================================================
      - name: Check Teddi imports
        run: |
          set -euo pipefail

          python - <<'PY'
          import aiohttp
          import rich

          print("aiohttp: OK")
          print("rich: OK")
          print("Teddi dependencies: OK")
          PY

      # ============================================================
      # HELP
      # ============================================================
      - name: Show Teddi help
        run: |
          set +e

          python Teddi_Iptv.py --help

          EXIT_CODE=$?

          echo "Teddi --help exit code: ${EXIT_CODE}"

          # --help не является обязательной частью работы парсера.
          # Поэтому его ошибка не останавливает основной запуск.
          exit 0

      # ============================================================
      # PREPARE OUTPUT
      # ============================================================
      - name: Prepare output
        run: |
          set -euo pipefail

          mkdir -p mega_iptv_output

          rm -f mega_iptv_output/mega_best.m3u
          rm -f mega_iptv_output/mega_all_streams.m3u
          rm -f mega_iptv_output/mega_12plus.m3u
          rm -f mega_iptv_output/mega_russia.m3u
          rm -f mega_iptv_output/mega_russia_12plus.m3u
          rm -f mega_iptv_output/Stable_Ru_IPTV.m3u
          rm -f mega_iptv_output/statistics.json
          rm -f mega_iptv_output/statistics.txt
          rm -f mega_iptv_output/stable_state.json

      # ============================================================
      # RUN TEDDI
      # ============================================================
      - name: Run Teddi IPTV Parser
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "START TEDDI IPTV PARSER"
          echo "=============================================="

          python -u Teddi_Iptv.py

          echo "=============================================="
          echo "TEDDI FINISHED"
          echo "=============================================="

      # ============================================================
      # SHOW OUTPUT
      # ============================================================
      - name: Show generated files
        if: always()
        run: |
          echo "=============================================="
          echo "TEDDI OUTPUT"
          echo "=============================================="

          if [ -d mega_iptv_output ]; then
            find mega_iptv_output \
              -type f \
              -printf '%p (%s bytes)\n' \
              | sort
          else
            echo "mega_iptv_output not found"
          fi

      # ============================================================
      # PLAYLIST STATISTICS
      # ============================================================
      - name: Playlist statistics
        if: always()
        run: |
          echo "=============================================="
          echo "PLAYLIST STATISTICS"
          echo "=============================================="

          for file in \
            mega_iptv_output/mega_best.m3u \
            mega_iptv_output/mega_all_streams.m3u \
            mega_iptv_output/mega_12plus.m3u \
            mega_iptv_output/mega_russia.m3u \
            mega_iptv_output/mega_russia_12plus.m3u \
            mega_iptv_output/Stable_Ru_IPTV.m3u
          do
            echo
            echo "FILE: $file"

            if [ -f "$file" ]; then
              ls -lh "$file"

              echo "EXTINF:"
              grep -c '^#EXTINF:' "$file" || true

              echo "URL:"
              grep -Evc '^(#|$)' "$file" || true
            else
              echo "NOT FOUND"
            fi
          done

      # ============================================================
      # JSON
      # ============================================================
      - name: Show statistics.json
        if: always()
        run: |
          echo "=============================================="
          echo "statistics.json"
          echo "=============================================="

          if [ -f mega_iptv_output/statistics.json ]; then
            cat mega_iptv_output/statistics.json
          else
            echo "statistics.json not found"
          fi

      # ============================================================
      # TXT
      # ============================================================
      - name: Show statistics.txt
        if: always()
        run: |
          echo "=============================================="
          echo "statistics.txt"
          echo "=============================================="

          if [ -f mega_iptv_output/statistics.txt ]; then
            cat mega_iptv_output/statistics.txt
          else
            echo "statistics.txt not found"
          fi

      # ============================================================
      # STABLE STATE
      # ============================================================
      - name: Show stable state
        if: always()
        run: |
          echo "=============================================="
          echo "stable_state.json"
          echo "=============================================="

          if [ -f mega_iptv_output/stable_state.json ]; then
            cat mega_iptv_output/stable_state.json
          else
            echo "stable_state.json not found"
          fi

      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload Teddi results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teddi-iptv-results-${{ github.run_number }}
          path: mega_iptv_output/
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # COMMIT RESULTS
      # ============================================================
      - name: Commit generated results
        if: success()
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mega_iptv_output/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Teddi IPTV: update results"
            git push
          fi